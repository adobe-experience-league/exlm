<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Playlist embed harness</title>
    <link rel="stylesheet" href="/styles/styles.css" />
    <link rel="stylesheet" href="/blocks/playlist/playlist.css" />
    <style>
      /* Minimal header/footer stubs for chrome assertions */
      aside {
        display: block;
        min-height: 32px;
        background: #f5f5f5;
      }
      header {
        display: block;
        height: var(--nav-height);
        background: #eee;
      }
      footer {
        display: block;
        min-height: 40px;
        background: #ddd;
      }
    </style>
  </head>
  <body class="appear">
    <aside data-testid="site-banner">Site-wide banner</aside>
    <header data-testid="site-header">ExL Header</header>
    <main class="playlist-page">
      <div class="playlist-player-container" data-playlist-player-container>
        <div class="playlist-player" data-playlist-player>
          <div class="playlist-player-video"><div style="aspect-ratio: 16/9; background: #ccc"></div></div>
          <div class="playlist-player-info">
            <h3 class="playlist-player-info-title">Video title</h3>
          </div>
        </div>
      </div>
      <div class="section playlist-container" data-section-status="loaded">
        <div class="playlist-wrapper">
          <div class="playlist">
            <div class="playlist-item active" data-index="0">Item 0</div>
            <div class="playlist-item" data-index="1">Item 1</div>
            <div class="playlist-item" data-index="2">Item 2</div>
            <div class="playlist-item" data-index="3">Item 3</div>
          </div>
        </div>
      </div>
    </main>
    <footer data-testid="site-footer">ExL Footer</footer>
    <script type="module">
      import {
        isPlaylistEmbedMode,
        PLAYLIST_EMBED_BODY_CLASS,
        buildPlaylistAttributionHref,
      } from '/scripts/utils/playlist-embed-utils.js';

      const params = new URLSearchParams(location.search);
      // Harness can force path via ?path= for unit-like embed detection
      const locationLike = {
        pathname: params.get('path') || '/en/playlists/demo',
        search: location.search,
      };
      const parentInfo = {
        framed: params.get('framed') === '1',
        ancestorOrigins: params.get('parent') ? [params.get('parent')] : [],
        referrer: params.get('referrer') || '',
      };

      if (isPlaylistEmbedMode(locationLike, parentInfo)) {
        document.body.classList.add(PLAYLIST_EMBED_BODY_CLASS);
        document.querySelector('.playlist-embed-attribution')?.remove();
        const wrap = document.createElement('div');
        wrap.className = 'playlist-embed-attribution';
        const link = document.createElement('a');
        link.className = 'playlist-embed-attribution-link button';
        link.href = buildPlaylistAttributionHref(location.href);
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.textContent = 'View more on Experience League';
        wrap.append(link);
        document.body.append(wrap);

        document.querySelectorAll('.playlist-item').forEach((item) => {
          item.addEventListener('click', () => {
            const idx = item.getAttribute('data-index');
            const url = new URL(location.href);
            url.searchParams.set('video', idx);
            history.pushState({ video: Number(idx) }, '', url);
            link.href = buildPlaylistAttributionHref(location.href);
            document.querySelectorAll('.playlist-item').forEach((el) => el.classList.remove('active'));
            item.classList.add('active');
          });
        });
      }

      document.documentElement.dataset.harnessReady = '1';
    </script>
  </body>
</html>
