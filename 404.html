<!doctype html>
<html>
  <head>
    <title>Page not found | Experience League | Adobe</title>
    <script src="/scripts/error-page-init.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta property="og:title" content="Page not found" />
    <script src="/scripts/scripts.js" type="module" crossorigin="use-credentials"></script>
    <script src="/scripts/error-page.js" type="module" crossorigin="use-credentials"></script>
    <link rel="stylesheet" href="/styles/styles.css" />
    <style>
      main.error .section {
        display: flex;
        flex-direction: column;
        padding: 0 !important;
      }

      main.error .section > div {
        margin: 0;
        max-width: unset;
        width: 100%;
      }

      main.error .section > div > div {
        display: grid;
        gap: 0.75rem;
        grid-auto-rows: 1fr;
        grid-auto-columns: 1fr;
        grid-template-columns: 1fr;
      }

      main.error .section > div > div > div:first-child {
        order: 2;
        margin-left: 8.33333337%;
        padding: 0.75rem;
      }

      main.error .section > div > div > div {
        position: relative;
      }

      @media (min-width: 600px) {
        main.error .section > div > div {
          grid-template-columns: 1fr 1fr;
        }
        main.error .section > div > div > div:first-child {
          order: -1;
        }
      }

      main.error .error-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        position: absolute;
      }

      ul {
        list-style: none !important;
      }
      ul li {
        margin: 0;
        margin-bottom: 0.5rem !important;
      }
    </style>
    <link rel="stylesheet" href="/styles/lazy-styles.css" />
  </head>

  <body>
    <header></header>
    <main class="error">
      <div class="section">
        <div>
          <div>
            <img class="error-image" src="/404.webp" alt="404" />
          </div>
        </div>
      </div>
    </main>
    <footer></footer>
  </body>
</html>
