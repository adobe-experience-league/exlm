<!doctype html>
<html>
  <head>
    <title>Page not found | Experience League | Adobe</title>
    <script type="text/javascript">
      window.isErrorPage = true;
      window.errorCode = '404';
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta property="og:title" content="Page not found" />
    <script src="/scripts/scripts.js" type="module" crossorigin="use-credentials"></script>
    <script type="module">
      import { sampleRUM } from '/scripts/lib-franklin.js';
      import { getPathDetails } from '/scripts/scripts.js';
      import { getCourseFragmentUrl } from '/scripts/courses/course-utils.js';
      const { lang = 'en' } = getPathDetails() || {};
      const errorPagePath = `/${lang}/404`;
      const defaultErrorHTML = `
              <div>
                  <p>Oops!</p>
                  <h1>The requested content was not found.</h1>
                  <p>Let us help you get back on the path.</p>
                  <h4>Most popular sections</h4>
                  <p><a href="/" title="Experience League homepage">Experience League homepage</a></p>
                  <p><a href="/${lang}/docs">Documentation</a></p>
                  <p><a href="/${lang}/playlists">Playlists</a></p>
                  <p><a href="//experienceleaguecommunities.adobe.com/">Community</a></p>
              </div>
            `;
      const fetchAndParseHTML = async (tagName) => {
        const container = document.querySelector('.section > div > div:first-child');
        try {
          const response = await fetch(errorPagePath);
          if (!response.ok) throw new Error('Network response was not ok');
          const text = await response.text();
          const parser = new DOMParser();
          const doc = parser.parseFromString(text, 'text/html');
          // Content authored in UE //
          const contentElementUE = doc.querySelector(tagName);
          if (contentElementUE) {
            container.prepend(contentElementUE.querySelector('div'));
          } else {
            // Default Error Message if there's no authored text in UE //
            container.insertAdjacentHTML('afterbegin', defaultErrorHTML);
          }
        } catch (error) {
          // Default Error Message in case of any error //
          container.insertAdjacentHTML('afterbegin', defaultErrorHTML);
        }
      };

      // A deleted step/module page 404s here even though its course is still live.
      // Redirect back to the course landing page instead of showing a generic 404.
      // The section is hidden (see the blocking script in <body>) for course/step
      // paths so it's laid out correctly from the start — we just reveal it here
      // once we know there's nowhere to redirect to.
      let redirected = false;
      const tryCourseRedirect = async () => {
        try {
          const courseUrl = getCourseFragmentUrl(window.location.pathname);
          if (!courseUrl) return;
          const response = await fetch(courseUrl);
          if (!response.ok) return;
          redirected = true;
          sampleRUM('404-course-redirect', { source: document.referrer, target: courseUrl });
          window.location.replace(courseUrl);
        } catch (error) {
          // eslint-disable-next-line no-console
          console.error(error);
          // Fall through to the generic 404 handling below //
        }
      };
      const courseRedirectAttempt = tryCourseRedirect().finally(() => {
        if (!redirected) {
          document.querySelector('main.error .section')?.style.removeProperty('visibility');
        }
      });

      window.addEventListener('load', async () => {
        await courseRedirectAttempt;
        if (redirected) return;
        sampleRUM('404', { source: document.referrer });
        fetchAndParseHTML('main');
      });
    </script>
    <link rel="stylesheet" href="/styles/styles.css" />
    <style>
      main.error .section {
        display: flex;
        flex-direction: column;
        padding: 0 !important;
      }

      main.error .section > div {
        margin: 0;
        max-width: unset;
        width: 100%;
      }

      main.error .section > div > div {
        display: grid;
        gap: 0.75rem;
        grid-auto-rows: 1fr;
        grid-auto-columns: 1fr;
        grid-template-columns: 1fr;
      }

      main.error .section > div > div > div:first-child {
        order: 2;
        margin-left: 8.33333337%;
        padding: 0.75rem;
      }

      main.error .section > div > div > div {
        position: relative;
      }

      @media (min-width: 600px) {
        main.error .section > div > div {
          grid-template-columns: 1fr 1fr;
        }
        main.error .section > div > div > div:first-child {
          order: -1;
        }
      }

      main.error .error-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        position: absolute;
      }

      ul {
        list-style: none !important;
      }
      ul li {
        margin: 0;
        margin-bottom: 0.5rem !important;
      }
    </style>
    <link rel="stylesheet" href="/styles/lazy-styles.css" />
  </head>

  <body>
    <header></header>
    <main class="error">
      <div class="section">
        <div>
          <div>
            <img class="error-image" src="/404.webp" alt="404" />
          </div>
        </div>
      </div>
      <script>
        (function () {
          // Mirrors getCourseFragmentUrl's path shape check (course-utils.js) without the
          // module import, so it can run synchronously right after the image above is
          // parsed — before the browser paints it. For course/step paths this hides the
          // image until the redirect check (deferred module script above) confirms
          // there's nowhere to redirect to; other 404s are unaffected and show it
          // immediately, same as always. The image itself stays real static HTML, so it
          // still renders even if JavaScript never runs.
          var parts = window.location.pathname.split('/').filter(Boolean);
          var idx = parts.indexOf('courses');
          var looksLikeCoursePath = idx > 0 && parts.length > idx + 1;
          if (looksLikeCoursePath) {
            document.querySelector('main.error .section').style.visibility = 'hidden';
          }
        })();
      </script>
    </main>
    <footer></footer>
  </body>
</html>
