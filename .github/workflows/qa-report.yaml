name: QA Pilot Report

on:
  workflow_run:
    workflows: ['QA Pilot Tests']
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  group: qa-report-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  report:
    if: >-
      github.repository == 'adobe-experience-league/exlm' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Only default-branch reporting code is executed with write permissions.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            package.json
            tools/qa/report.js
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download untrusted result data
        id: evidence
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: qa-pilot-evidence
          path: qa-evidence
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Update advisory PR comment
        uses: actions/github-script@v7
        env:
          EVIDENCE_OUTCOME: ${{ steps.evidence.outcome }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { pathToFileURL } = require('node:url');
            const { createComment, MARKER } = await import(pathToFileURL(path.resolve('tools/qa/report.js')).href);
            const run = context.payload.workflow_run;
            const { data: currentRun } = await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: run.id,
            });
            if (currentRun.run_attempt !== run.run_attempt) {
              core.notice('A newer run attempt exists; ignoring stale results.');
              return;
            }
            const linked = run.pull_requests;
            if (!Array.isArray(linked) || !linked.length) {
              core.notice('No associated PR; nothing to report.');
              return;
            }
            const readJson = (name, optional = false) => {
              const filename = path.join('qa-evidence', name);
              if (optional && !fs.existsSync(filename)) return undefined;
              if (fs.statSync(filename).size > 5 * 1024 * 1024) throw new Error('QA JSON exceeds 5 MiB limit.');
              return JSON.parse(fs.readFileSync(filename, 'utf8'));
            };
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${run.id}`;
            let body;
            try {
              if (process.env.EVIDENCE_OUTCOME !== 'success') throw new Error('QA evidence could not be downloaded.');
              body = createComment({
                plan: readJson('plan.json'),
                reports: { functional: readJson('functional.json', true), visual: readJson('visual.json', true) },
                conclusion: run.conclusion,
                sha: run.head_sha,
                runUrl,
              });
            } catch (error) {
              core.error(`QA reporting failed: ${error.message}`);
              body = `${MARKER}\n### QA pilot - advisory\n\nExecution/reporting error for commit \`${run.head_sha}\`. Results are incomplete; this is not a pass.\n\n[Inspect execution and evidence](${runUrl})`;
              core.setFailed('QA results are missing or invalid.');
            }
            for (const link of linked) {
              const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: link.number });
              if (pr.state !== 'open' || pr.draft || pr.head.sha !== run.head_sha ||
                  pr.head.repo.full_name !== context.payload.repository.full_name) continue;
              const issue_number = pr.number;
              const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number });
              const existing = comments.find(c => c.user?.login === 'github-actions[bot]' && c.body?.includes(MARKER));
              if (existing) {
                await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ ...context.repo, issue_number, body });
              }
            }
