name: Visual Tests

# Runs the full visual regression suite on every PR update and keeps a single
# results comment on the PR up to date. Rerun with GitHub's "Re-run jobs".

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: visual-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  COMMENT_MARKER: '<!-- exlm-visual-tests -->'

jobs:
  visual-tests:
    name: Visual Tests
    runs-on: ubuntu-latest
    # Same image used for local Docker runs, so rendering matches the committed baselines.
    container:
      image: mcr.microsoft.com/playwright:v1.53.1-jammy
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    env:
      # Fork PRs receive a read-only token, so they run the tests without commenting.
      CAN_COMMENT: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Mark results comment as running
        if: env.CAN_COMMENT == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = process.env.COMMENT_MARKER;
            const issue_number = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              '### Visual Tests',
              '',
              `:hourglass_flowing_sand: **Running** against \`${sha.slice(0, 7)}\`. Results will appear here when the run completes.`,
              '',
              `[View run](${runUrl})`,
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number, body });
            }

      - name: Install dependencies
        run: npm ci

      - name: Install AEM CLI
        run: npm install -g @adobe/aem-cli

      - name: Run visual tests
        id: tests
        run: npx playwright test --config=tools/visual-tests/playwright.config.ts
        continue-on-error: true

      - name: Upload Playwright report
        id: upload-report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tools/visual-tests/playwright-report/
          retention-days: 7

      - name: Upload failure artifacts
        if: ${{ !cancelled() && steps.tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tools/visual-tests/test-results/
          retention-days: 3

      - name: Publish results comment
        if: ${{ !cancelled() && env.CAN_COMMENT == 'true' }}
        uses: actions/github-script@v7
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          REPORT_URL: ${{ steps.upload-report.outputs.artifact-url }}
        with:
          script: |
            const fs = require('node:fs');
            const marker = process.env.COMMENT_MARKER;
            const issue_number = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const reportUrl = process.env.REPORT_URL;

            const collect = (suites, acc = []) => {
              for (const suite of suites ?? []) {
                for (const spec of suite.specs ?? []) {
                  for (const test of spec.tests ?? []) acc.push({ title: spec.title, status: test.status });
                }
                collect(suite.suites, acc);
              }
              return acc;
            };
            const parseTitle = (title) => {
              const match = title.match(/^(.+?) visual test at (.+?) viewport/);
              return match ? { block: match[1], viewport: match[2] } : { block: title, viewport: '' };
            };
            const formatDuration = (ms) => {
              const total = Math.round(ms / 1000);
              const minutes = Math.floor(total / 60);
              return minutes ? `${minutes}m ${total % 60}s` : `${total}s`;
            };
            const groupByBlock = (tests) => {
              const groups = new Map();
              for (const { title } of tests) {
                const { block, viewport } = parseTitle(title);
                if (!groups.has(block)) groups.set(block, []);
                if (viewport) groups.get(block).push(viewport);
              }
              return [...groups].map(([block, viewports]) => `| \`${block}\` | ${viewports.join(', ') || '—'} |`);
            };

            const links = [`[View run](${runUrl})`];
            if (reportUrl) links.unshift(`[Download HTML report](${reportUrl})`);
            const lines = [marker, '### Visual Tests', ''];

            let results;
            try {
              results = JSON.parse(fs.readFileSync('tools/visual-tests/test-results/results.json', 'utf8'));
            } catch {
              results = null;
            }

            if (!results) {
              lines.push(
                ':warning: **Results unavailable.** The suite did not produce a results file; check the run logs.',
                '',
              );
            } else {
              const { stats } = results;
              const passed = stats.expected ?? 0;
              const failed = stats.unexpected ?? 0;
              const flaky = stats.flaky ?? 0;
              const skipped = stats.skipped ?? 0;
              const total = passed + failed + flaky + skipped;
              const tests = collect(results.suites);

              lines.push(
                failed
                  ? `:x: **${failed} of ${total} visual tests failed.**`
                  : `:white_check_mark: **All ${total} visual tests passed.**`,
                '',
                '| Passed | Failed | Flaky | Skipped | Duration |',
                '| :---: | :---: | :---: | :---: | :---: |',
                `| ${passed} | ${failed} | ${flaky} | ${skipped} | ${formatDuration(stats.duration ?? 0)} |`,
                '',
              );

              const failedTests = tests.filter((t) => t.status === 'unexpected');
              if (failedTests.length) {
                lines.push('#### Failures', '', '| Block | Viewports |', '| --- | --- |', ...groupByBlock(failedTests), '');
                lines.push(
                  'If a change is intentional, update the baselines with `npm run test:visual:update` and commit the new snapshots.',
                  '',
                );
              }

              const flakyTests = tests.filter((t) => t.status === 'flaky');
              if (flakyTests.length) {
                lines.push(
                  '<details><summary>Flaky tests (passed on retry)</summary>',
                  '',
                  '| Block | Viewports |',
                  '| --- | --- |',
                  ...groupByBlock(flakyTests),
                  '',
                  '</details>',
                  '',
                );
              }
            }

            lines.push(`${links.join(' · ')}`, '', `<sub>Commit \`${sha.slice(0, 7)}\` · Run #${context.runNumber}</sub>`);
            const body = lines.join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number, body });
            }

      - name: Fail if visual tests failed
        if: ${{ steps.tests.outcome == 'failure' }}
        run: exit 1
